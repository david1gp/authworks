<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Authworks identity platform" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        let stored
        try {
          stored = localStorage.getItem("theme")
        } catch {}
        const theme = stored === "light" || stored === "dark" || stored === "os" ? stored : "os"
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", theme === "dark" || (theme === "os" && prefersDark))
      })()
    </script>
    <title>Authworks</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
